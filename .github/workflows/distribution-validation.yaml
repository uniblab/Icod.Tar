name: distribution-validation

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-distributions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            architecture: x64
          - os: windows-11-arm
            platform: Windows
            architecture: ARM64
          - os: ubuntu-24.04
            platform: Linux
            architecture: x64
          - os: ubuntu-24.04-arm
            platform: Linux
            architecture: ARM64
          - os: macos-15-intel
            platform: macOS
            architecture: x64
          - os: macos-15
            platform: macOS
            architecture: ARM64
    name: ${{ matrix.platform }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build, pack, install, and exercise distributions
        shell: pwsh
        run: ./packaging/VerifyDistribution.ps1 -Configuration Release
